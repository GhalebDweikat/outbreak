[project]
name = "outbreak"
version = "0.1.0"
description = "Does misbehaviour spread between AI agents, and how much peer enforcement stops it? Offline experiment, in progress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ghaleb Dweikat" }]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.6,<2"]
dev = ["pytest>=8"]

[project.scripts]
outbreak = "outbreak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outbreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
